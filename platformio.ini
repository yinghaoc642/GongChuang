[platformio]
default_envs = genericSTM32H750VB

[env:genericSTM32H750VB]
platform = ststm32
board = genericSTM32H750VB_cmsis_dap
framework = arduino
monitor_speed = 115200
lib_deps =
	waspinator/AccelStepper@^1.64
	mathertel/OneButton@^2.6.2
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
build_flags =
	-flto
; 仅编译正式入口；route_chassis_main.inc 由 main.cpp 在命名空间中包含。
build_src_filter = -<*> +<main.cpp>

; 独立扫码程序。指定 -e debug_qr_continuous 才会编译/烧录此入口。
[env:debug_qr_continuous]
extends = env:genericSTM32H750VB
build_src_filter = -<*> +<debug_qr_continuous.cpp>

; 独立工位程序。三种动作由 src/debug_workstation.cpp 顶部宏选择。
[env:debug_workstation]
extends = env:genericSTM32H750VB
build_flags =
	${env:genericSTM32H750VB.build_flags}
	-DGONGCHUANG_MAIX_COORDINATE_TELEMETRY=1
build_src_filter = -<*> +<debug_workstation.cpp>

; 独立原料区调试：不执行路线；当前默认旧A点夹取逻辑，车轮不运动。
[env:debug_raw_workstation]
extends = env:genericSTM32H750VB
build_flags =
	${env:genericSTM32H750VB.build_flags}
	-DGONGCHUANG_MAIX_COORDINATE_TELEMETRY=1
	-DGONGCHUANG_RAW_VERBOSE_VISION_CALIBRATION=1
build_src_filter = -<*> +<debug_raw_workstation.cpp>

; 原料区3->4->1复现程序：正式原料区机械臂/料盘动作，旧A点逻辑，底盘不移动。
[env:debug_raw_workstation_341]
extends = env:genericSTM32H750VB
build_flags =
	${env:genericSTM32H750VB.build_flags}
	-DGONGCHUANG_MAIX_COORDINATE_TELEMETRY=1
	-DGONGCHUANG_RAW_VERBOSE_VISION_CALIBRATION=1
build_src_filter = -<*> +<debug_raw_workstation_341.cpp>

; 固定只运行第二次暂存区工位动作，无需手改 debug_workstation.cpp 顶部宏。
[env:debug_storage2_workstation]
extends = env:genericSTM32H750VB
build_flags =
	${env:genericSTM32H750VB.build_flags}
	-DGONGCHUANG_MAIX_COORDINATE_TELEMETRY=1
build_src_filter = -<*> +<debug_storage2_workstation.cpp>

; 单段底盘平移。规范段号由 debug_translation.cpp 顶部宏选择；默认第4段，
; 这里单独复用旧式终点前190 mm扫码等待，不执行启停区1整套新路线状态机。
[env:debug_translation]
extends = env:genericSTM32H750VB
build_src_filter = -<*> +<debug_translation.cpp>

; 完整底盘路线调试：复用正式路线实现；默认执行启停区1新路线状态机，
; 包括中心左移扫码/等距归位，不运行任何工位、机械臂或物料操作。
[env:debug_chassis_route]
extends = env:genericSTM32H750VB
build_src_filter = -<*> +<debug_chassis_route.cpp>

; MaixCAM模式8直连测试：只发送模式8请求，不发送停止帧，也不初始化其他硬件。
[env:debug_maix_mode8]
extends = env:genericSTM32H750VB
build_src_filter = -<*> +<debug_maix_mode8.cpp>

; 正式MaixCamClient最小循环：STOP->3->STOP->4->STOP->1；不初始化任何机构。
[env:debug_maix_protocol_cycle]
extends = env:genericSTM32H750VB
build_src_filter = -<*> +<debug_maix_protocol_cycle.cpp>
