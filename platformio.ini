; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; 本工程只允许默认构建/烧录正式主程序 src/main.cpp。
; main_v0 已移入 true_example 归档，不属于当前固件环境。
[platformio]
default_envs = genericSTM32H750VB

[env:genericSTM32H750VB]
platform = ststm32
board = genericSTM32H750VB_cmsis_dap
framework = arduino
monitor_speed = 115200
lib_deps = 
	waspinator/AccelStepper@^1.64
	mathertel/OneButton@^2.6.2
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
; 先排除 src 中的全部源文件，再只纳入正式入口，防止以后误放测试文件。
build_src_filter = -<*> +<main.cpp>
